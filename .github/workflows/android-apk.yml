name: Build APK KuyTitip

# Build otomatis setiap ada perubahan di folder mobile/, atau jalankan manual dari tab Actions.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/KuyTitip-v${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: KuyTitip-v${{ steps.apk.outputs.version }}
          path: mobile/dist/*.apk

      - name: Publish release (link unduh langsung dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.apk.outputs.version }}
          name: KuyTitip v${{ steps.apk.outputs.version }}
          body: |
            APK internal KuyTitip — unduh file .apk di bawah lalu pasang di HP Android
            (izinkan "Install unknown apps" untuk browser/WhatsApp/File Manager).
            Update: cukup pasang APK versi baru di atas versi lama, data tetap aman.
          files: mobile/dist/*.apk
          make_latest: true
