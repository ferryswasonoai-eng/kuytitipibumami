name: Supabase keep-alive

# Proyek Supabase gratis di-pause setelah 7 hari tanpa aktivitas.
# Workflow ini memanggil katalog setiap 2 hari supaya proyek tetap aktif.
on:
  schedule:
    - cron: '17 1 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -f -X POST \
            "https://cxresrjjlzruyerkqqqy.supabase.co/rest/v1/rpc/catalog" \
            -H "apikey: sb_publishable_lyO2s8UewUmXqA2uCPWLlA_kra7091D" \
            -H "Content-Type: application/json" -d '{}' -o /dev/null -w "HTTP %{http_code}\n"
