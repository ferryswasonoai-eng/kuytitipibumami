<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf5f3" />
  <title>Katalog Jastip</title>
  <meta name="description" content="Katalog jastip — pilih barang, masukkan keranjang, kirim pesanan lewat WhatsApp." />
  <link rel="icon" href="icon.png" />
  <link rel="stylesheet" href="toko.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/><path d="M10 12a2 2 0 0 0 4 0"/></svg></span>
      <span class="brand-name" id="biz">Katalog Jastip</span>
    </div>
    <a class="chat" id="chatBtn" href="#" target="_blank" rel="noopener" hidden>💬 Chat admin</a>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow" id="tripLbl">Katalog</p>
      <h1 id="heroTitle">Titip barang ori, langsung dari tokonya</h1>
      <p>Pilih barang, masukkan keranjang, lalu kirim pesanan — admin akan konfirmasi lewat WhatsApp.</p>
    </section>
    <div id="po"></div>
    <div class="tools">
      <input class="input" id="q" type="search" placeholder="Cari produk…" aria-label="Cari produk" />
      <div class="chips" id="brands"></div>
    </div>
    <div class="grid" id="grid">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
    <p class="foot">Harga sudah termasuk jasa titip. Ongkir ke alamat Anda dikonfirmasi admin.</p>
  </main>

  <div class="cartbar" id="cartbar" hidden>
    <div><b id="cartTotal">Rp 0</b><div class="small" id="cartCount">0 barang</div></div>
    <button id="openCart" type="button">Lihat keranjang</button>
  </div>

  <dialog class="sheet" id="sheet"></dialog>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="toko.js"></script>
</body>
</html>
